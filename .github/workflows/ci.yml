name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors está ligado: qualquer warning quebra este passo.
      - name: Build
        run: dotnet build --no-restore -c Release

      # Testes de integração usam Testcontainers (Docker já disponível no runner).
      - name: Test
        run: dotnet test --no-build -c Release

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bank-ledger:ci .
